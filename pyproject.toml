[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sefi-voxel"
version = "0.1.0"
description = "SEFI voxel and phase-control research prototypes"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyserial>=3.5"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
